name: Backlink Backfill

on:
  schedule:
    # Automatic backlink coverage is part of the growth system. Keep it running;
    # cost controls belong inside the generation/syndication calls, not by
    # disabling the backlink automation itself.
    - cron: "37 */2 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Posts per run (default 3)"
        default: "3"
      platforms:
        description: "Comma-separated platforms (default: all backlink platforms)"
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    concurrency:
      group: voa-backlink-backfill
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check backlog (dry run)
        run: node scripts/backfill-backlinks.js
        continue-on-error: true  # exit 2 means backlog exists, that's fine

      - name: Run backfill batch
        id: backfill
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          SYNDICATION_COMPANION_MODEL:  ${{ vars.SYNDICATION_COMPANION_MODEL || 'claude-haiku-4-5-20251001' }}
          BACKLINK_CATCHUP_BATCH:       8
          BACKLINK_MAINTENANCE_BATCH:   3
          BACKLINK_INTER_POST_DELAY_SECONDS: 8
          PLATFORM_TIMEOUT_MS:          60000
          BLOGGER_CLIENT_ID:           ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET:       ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN:       ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID:             ${{ secrets.BLOGGER_BLOG_ID }}
          DEVTO_API_KEY:               ${{ secrets.DEVTO_API_KEY }}
          DEVTO2_API_KEY:              ${{ secrets.DEVTO2_API_KEY }}
          VOA_TUMBLR_CONSUMER_KEY:     ${{ secrets.VOA_TUMBLR_CONSUMER_KEY }}
          VOA_TUMBLR_CONSUMER_SECRET:  ${{ secrets.VOA_TUMBLR_CONSUMER_SECRET }}
          VOA_TUMBLR_TOKEN:            ${{ secrets.VOA_TUMBLR_TOKEN }}
          VOA_TUMBLR_TOKEN_SECRET:     ${{ secrets.VOA_TUMBLR_TOKEN_SECRET }}
          VOA_TUMBLR_BLOG_NAME:        ${{ secrets.VOA_TUMBLR_BLOG_NAME }}
          WORDPRESS_OAUTH2_TOKEN:      ${{ secrets.WORDPRESS_OAUTH2_TOKEN }}
          WORDPRESS_BLOG:              ${{ secrets.WORDPRESS_BLOG }}
          WORDPRESS_CATEGORY_NAMES:    ${{ secrets.WORDPRESS_CATEGORY_NAMES }}
          WORDPRESS_TAG_NAMES:         ${{ secrets.WORDPRESS_TAG_NAMES }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
        run: |
          BATCH="${{ github.event.inputs.batch }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"
          ARGS="--execute"
          [ -n "$BATCH" ] && ARGS="$ARGS --batch $BATCH"
          [ -n "$PLATFORMS" ] && ARGS="$ARGS --platforms $PLATFORMS"
          set +e
          node scripts/backfill-backlinks.js $ARGS
          BACKFILL_EXIT=$?
          set -e
          node scripts/syndication-backlog-status.js --write
          node scripts/seo-strategy-status.js
          echo "exit_code=$BACKFILL_EXIT" >> $GITHUB_OUTPUT
          exit $BACKFILL_EXIT
        continue-on-error: true

      - name: Commit results
        run: |
          git config user.name  "voa-bot"
          git config user.email "bot@vibrationofawesome.com"
          git add static/_data/syndication-results.json static/_data/syndication-log.json static/_data/syndication-backlog-status.json static/_data/seo-strategy.json data/ops/syndication-companion-cache.json || true
          if git diff --staged --quiet; then
            echo "No backlink result changes to commit."
            exit 0
          fi
          git commit -m "Backfill backlinks batch [automated]"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt) ~ rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main
          done
          echo "::error::Unable to push backlink backfill results after 3 attempts"
          exit 1

      - name: Report status
        run: |
          node scripts/syndication-backlog-status.js

      - name: Fail if a backlink task failed
        if: steps.backfill.outputs.exit_code == '1'
        run: exit 1
