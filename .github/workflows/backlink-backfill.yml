name: Backlink Backfill

on:
  schedule:
    # Every 4 hours — clears 3 posts per run, 26-post backlog done in ~9 runs (~36 hrs)
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Posts per run (default 3)"
        default: "3"
      platforms:
        description: "Comma-separated platforms (default: all backlink platforms)"
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check backlog (dry run)
        run: node scripts/backfill-backlinks.js
        continue-on-error: true  # exit 2 means backlog exists, that's fine

      - name: Run backfill batch
        id: backfill
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          BLOGGER_CLIENT_ID:           ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET:       ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN:       ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID:             ${{ secrets.BLOGGER_BLOG_ID }}
          DEVTO_API_KEY:               ${{ secrets.DEVTO_API_KEY }}
          TUMBLR_CONSUMER_KEY:         ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET:      ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_TOKEN:                ${{ secrets.TUMBLR_TOKEN }}
          TUMBLR_TOKEN_SECRET:         ${{ secrets.TUMBLR_TOKEN_SECRET }}
          TUMBLR_BLOG_NAME:            ${{ secrets.TUMBLR_BLOG_NAME }}
          WP_SITE_URL:                 ${{ secrets.WP_SITE_URL }}
          WP_USERNAME:                 ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:             ${{ secrets.WP_APP_PASSWORD }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
        run: |
          BATCH="${{ github.event.inputs.batch || '3' }}"
          PLATFORMS="${{ github.event.inputs.platforms }}"
          ARGS="--execute --batch $BATCH"
          [ -n "$PLATFORMS" ] && ARGS="$ARGS --platforms $PLATFORMS"
          node scripts/backfill-backlinks.js $ARGS
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Backfill backlinks batch [automated]"
          file_pattern: "static/_data/syndication-results.json static/_data/syndication-log.json"
          commit_user_name: "voa-bot"
          commit_user_email: "bot@vibrationofawesome.com"

      - name: Report status
        run: |
          REMAINING=$(node scripts/backfill-backlinks.js 2>/dev/null | grep "Remaining in backlog" | grep -o '[0-9]*' | head -1 || echo "?")
          echo "Backlog remaining after this run: $REMAINING"
