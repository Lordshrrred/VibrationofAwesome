name: Drip Publish ~ Boom Frequency

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ── PUBLISH RATE CONFIG ────────────────────────────────────────────────────────
# Phase Two: 3-4 posts/day (active June 16 2026)
#
#  SLOT  TIME (ET)  UTC   NICHE/TYPE          SOCIAL  DEVTO        BACKLINKS
#  ────  ─────────  ───   ──────────────────  ──────  ─────────    ─────────
#  A     9:00 AM    13h   Normal drip          YES    Account 1    all
#  B     12:00 PM   16h   AI Advantage camp    no     Account 2    all
#  C     3:00 PM    19h   Normal drip (fast)   no     Account 2    all
#  D     6:00 PM    22h   Normal drip          YES    Account 1    all
#  E     9:00 PM    01h   Art buyer (future)   no     Account 2    Pinterest
#
# Dev.to safety: Account 1 = 2/day (slots A+D). Account 2 = 2/day (slots B+C).
# Social safety: 2 posts/day max (slots A+D only).
#
# Slot C (3pm) added June 16 to burn through the existing 51-post queue faster.
# At 3 normal posts/day (A+C+D) queue clears ~July 3 instead of July 11.
#
# PHASE THREE ~ target July 7 2026 (3 weeks from now):
#   - Switch slot C from normal-drip to ai-advantage-campaign
#   - Switch slot E from art-buyer to ai-advantage-campaign
#   - Result: 2 campaign posts/day + 2 normal posts/day = 4 total
#   - Dev.to: Account 1 = 2/day, Account 2 = 2/day
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 13 * * *'    # 9:00 AM ET  (UTC-4 EDT)  ~ slot A: normal, full social
    - cron: '0 16 * * *'    # 12:00 PM ET (UTC-4 EDT)  ~ slot B: AI Advantage campaign
    - cron: '0 19 * * *'    # 3:00 PM ET  (UTC-4 EDT)  ~ slot C: normal, SEO-only (speed burn)
    - cron: '0 22 * * *'    # 6:00 PM ET  (UTC-4 EDT)  ~ slot D: normal, full social
    - cron: '0 1 * * *'     # 9:00 PM ET  (UTC-4 EDT)  ~ slot E: art buyer (future)
  workflow_dispatch:          # Manual trigger for testing or emergency publish

# Prevent any VOA publishing/syndication run from overlapping.
# Boom manual generation and drip publishing share this queue because they both
# post to the same platform accounts and can trigger the feeder repo.
concurrency:
  group: voa-publish-and-syndicate
  cancel-in-progress: false

permissions:
  contents: write     # commit + push published posts
  actions:  write     # trigger hugo.yml deploy after publish

jobs:
  drip:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Setup Node ────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Enforce no em dashes
        run: npm run check:emdash

      # ── 4. Check drip queue status ───────────────────────────────────────
      - name: Check drip queue status
        id: queue_status
        run: |
          if [ ! -f "static/_data/drip-queue.json" ]; then
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "remaining=0"   >> $GITHUB_OUTPUT
            echo "drip-queue.json not found ~ skipping."
          else
            STATUS=$(node -e "
              const q = JSON.parse(require('fs').readFileSync('static/_data/drip-queue.json','utf8'));
              console.log(q.status);
            ")
            REMAINING=$(node -e "
              const q = JSON.parse(require('fs').readFileSync('static/_data/drip-queue.json','utf8'));
              console.log(q.queue.length);
            ")
            echo "status=$STATUS"       >> $GITHUB_OUTPUT
            echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
            echo "Drip queue ~ status: $STATUS | posts remaining: $REMAINING"
          fi

      # ── 5. Exit safely if paused or empty ────────────────────────────────
      - name: Exit if paused or empty
        if: |
          steps.queue_status.outputs.status == 'paused' ||
          steps.queue_status.outputs.status == 'missing' ||
          steps.queue_status.outputs.remaining == '0'
        run: |
          STATUS="${{ steps.queue_status.outputs.status }}"
          REMAINING="${{ steps.queue_status.outputs.remaining }}"
          if   [ "$STATUS" = "paused"  ]; then echo "Queue is paused ~ no posts published.  Run activate-drip.js to resume."
          elif [ "$STATUS" = "missing" ]; then echo "drip-queue.json not found ~ exiting safely."
          elif [ "$REMAINING" = "0"    ]; then echo "Queue is empty ~ all posts published!"
          fi
          exit 0

      # ── 6. Publish next post(s) from drip queue ──────────────────────────
      - name: Publish next drip post(s)
        id: publish
        if: steps.queue_status.outputs.status == 'active' && steps.queue_status.outputs.remaining != '0'
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          VOA_FEEDER_TRIGGER_TOKEN:    ${{ secrets.VOA_FEEDER_TRIGGER_TOKEN }}
          NASA_API_KEY:                ${{ secrets.NASA_API_KEY }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
          ESR_BLUESKY_HANDLE:          ${{ secrets.ESR_BLUESKY_HANDLE }}
          ESR_BLUESKY_APP_PASSWORD:    ${{ secrets.ESR_BLUESKY_APP_PASSWORD }}
          VOA_BLUESKY_HANDLE:          ${{ secrets.VOA_BLUESKY_HANDLE }}
          VOA_BLUESKY_APP_PASSWORD:    ${{ secrets.VOA_BLUESKY_APP_PASSWORD }}
          BLUESKY_HANDLE:              ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD:        ${{ secrets.BLUESKY_APP_PASSWORD }}
          ESR_MASTODON_INSTANCE:       ${{ secrets.ESR_MASTODON_INSTANCE }}
          ESR_MASTODON_ACCESS_TOKEN:   ${{ secrets.ESR_MASTODON_ACCESS_TOKEN }}
          VOA_MASTODON_INSTANCE:       ${{ secrets.VOA_MASTODON_INSTANCE }}
          VOA_MASTODON_ACCESS_TOKEN:   ${{ secrets.VOA_MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE:           ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN:       ${{ secrets.MASTODON_ACCESS_TOKEN }}
          META_APP_ID:                 ${{ secrets.META_APP_ID }}
          META_APP_SECRET:             ${{ secrets.META_APP_SECRET }}
          META_USER_TOKEN:             ${{ secrets.META_USER_TOKEN }}
          META_PAGE_ID_VOA:            ${{ secrets.META_PAGE_ID_VOA }}
          META_PAGE_TOKEN_VOA:         ${{ secrets.META_PAGE_TOKEN_VOA }}
          META_PAGE_ID_EARTHSTAR:      ${{ secrets.META_PAGE_ID_EARTHSTAR }}
          META_PAGE_TOKEN_EARTHSTAR:   ${{ secrets.META_PAGE_TOKEN_EARTHSTAR }}
          META_PAGE_ID_RUZINDLA:       ${{ secrets.META_PAGE_ID_RUZINDLA }}
          META_PAGE_TOKEN_RUZINDLA:    ${{ secrets.META_PAGE_TOKEN_RUZINDLA }}
          DEVTO_API_KEY:               ${{ secrets.DEVTO_API_KEY }}
          DEVTO2_API_KEY:              ${{ secrets.DEVTO2_API_KEY }}
          VOA_TUMBLR_CONSUMER_KEY:     ${{ secrets.VOA_TUMBLR_CONSUMER_KEY }}
          VOA_TUMBLR_CONSUMER_SECRET:  ${{ secrets.VOA_TUMBLR_CONSUMER_SECRET }}
          VOA_TUMBLR_TOKEN:            ${{ secrets.VOA_TUMBLR_TOKEN }}
          VOA_TUMBLR_TOKEN_SECRET:     ${{ secrets.VOA_TUMBLR_TOKEN_SECRET }}
          VOA_TUMBLR_BLOG_NAME:        ${{ secrets.VOA_TUMBLR_BLOG_NAME }}
          PUBLER_API_KEY:              ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID:         ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_PINTEREST_ACCOUNT_ID: ${{ secrets.PUBLER_PINTEREST_ACCOUNT_ID }}
          PUBLER_PINTEREST_BOARD_ID:   ${{ secrets.PUBLER_PINTEREST_BOARD_ID }}
          PUBLER_INSTAGRAM_ACCOUNT_ID: ${{ secrets.PUBLER_INSTAGRAM_ACCOUNT_ID }}
          PUBLER_THREADS_ACCOUNT_ID:   ${{ secrets.PUBLER_THREADS_ACCOUNT_ID }}
          PUBLER_FACEBOOK_ACCOUNT_ID:  ${{ secrets.PUBLER_FACEBOOK_ACCOUNT_ID }}
          BLOGGER_CLIENT_ID:           ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET:       ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN:       ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID:             ${{ secrets.BLOGGER_BLOG_ID }}
          WORDPRESS_OAUTH2_TOKEN:      ${{ secrets.WORDPRESS_OAUTH2_TOKEN }}
          WORDPRESS_BLOG:              ${{ secrets.WORDPRESS_BLOG }}
          WORDPRESS_CATEGORY_NAMES:    ${{ secrets.WORDPRESS_CATEGORY_NAMES }}
          WORDPRESS_TAG_NAMES:         ${{ secrets.WORDPRESS_TAG_NAMES }}
          DASHBOARD_PASSWORD:          ${{ secrets.DASHBOARD_PASSWORD }}
          IDEOGRAM_API_KEY:            ${{ secrets.IDEOGRAM_API_KEY }}
        run: |
          npm run check:syndication -- --write || echo "[warn] Syndication health check had non-critical failures ~ continuing drip publish"
          if [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
            echo "[drip] Slot B (12pm ET) → AI Advantage campaign, SEO backlinks + devto2, no social"
            node scripts/drip-publish.js --niche ai-advantage-campaign --limit 1 --syndication-profile campaign-seo
          elif [ "${{ github.event.schedule }}" = "0 19 * * *" ]; then
            echo "[drip] Slot C (3pm ET) → normal drip speed burn, SEO backlinks + devto2, no social"
            node scripts/drip-publish.js --limit 1 --syndication-profile campaign-seo
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            echo "[drip] Slot E (9pm ET) → art buyer, devto2 only"
            node scripts/drip-publish.js --niche art-buyer-intent --limit 1 --syndication-profile art-devto2-only
          else
            node scripts/drip-publish.js
          fi

      # ── 7. Commit published posts back to repo ────────────────────────────
      - name: Commit published posts
        id: commit
        if: steps.queue_status.outputs.status == 'active' && steps.queue_status.outputs.remaining != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage every generated artifact from the clean Actions runner.
          # A previous explicit-only list missed one generated file, leaving
          # the tree dirty and causing `git pull --rebase` to fail after the
          # post had already syndicated.
          git add -A \
            static/blog/boom/posts/ \
            static/_data/ \
            static/sitemap.xml \
            || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Unexpected generated changes remain outside standard drip paths; staging all runner changes before rebase."
            git status --short
            git add -A
          fi
          if git diff --staged --quiet; then
            echo "nothing_committed=true" >> $GITHUB_OUTPUT
            echo "Nothing new to commit."
          else
            git commit -m "Drip publish: $(date -u '+%Y-%m-%d %H:%M UTC') [automated]"
            git fetch origin main
            git merge --no-edit -X ours origin/main
            git push
            echo "nothing_committed=false" >> $GITHUB_OUTPUT
          fi

      # ── 8. Wait for Vercel to pick up the push and go live ───────────────────
      # Vercel auto-deploys on every push via its GitHub App integration.
      # No hugo.yml trigger needed (GitHub Pages retired; Vercel is the only host).

      - name: Verify live URL then syndicate
        id: post_live
        if: |
          steps.queue_status.outputs.status == 'active' &&
          steps.queue_status.outputs.remaining != '0' &&
          steps.commit.outputs.nothing_committed != 'true'
        env:
          LIVE_CHECK_ATTEMPTS:          30
          LIVE_CHECK_INTERVAL_MS:       20000
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          VOA_FEEDER_TRIGGER_TOKEN:    ${{ secrets.VOA_FEEDER_TRIGGER_TOKEN }}
          NASA_API_KEY:                ${{ secrets.NASA_API_KEY }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
          ESR_BLUESKY_HANDLE:          ${{ secrets.ESR_BLUESKY_HANDLE }}
          ESR_BLUESKY_APP_PASSWORD:    ${{ secrets.ESR_BLUESKY_APP_PASSWORD }}
          VOA_BLUESKY_HANDLE:          ${{ secrets.VOA_BLUESKY_HANDLE }}
          VOA_BLUESKY_APP_PASSWORD:    ${{ secrets.VOA_BLUESKY_APP_PASSWORD }}
          BLUESKY_HANDLE:              ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD:        ${{ secrets.BLUESKY_APP_PASSWORD }}
          ESR_MASTODON_INSTANCE:       ${{ secrets.ESR_MASTODON_INSTANCE }}
          ESR_MASTODON_ACCESS_TOKEN:   ${{ secrets.ESR_MASTODON_ACCESS_TOKEN }}
          VOA_MASTODON_INSTANCE:       ${{ secrets.VOA_MASTODON_INSTANCE }}
          VOA_MASTODON_ACCESS_TOKEN:   ${{ secrets.VOA_MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE:           ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN:       ${{ secrets.MASTODON_ACCESS_TOKEN }}
          META_APP_ID:                 ${{ secrets.META_APP_ID }}
          META_APP_SECRET:             ${{ secrets.META_APP_SECRET }}
          META_USER_TOKEN:             ${{ secrets.META_USER_TOKEN }}
          META_PAGE_ID_VOA:            ${{ secrets.META_PAGE_ID_VOA }}
          META_PAGE_TOKEN_VOA:         ${{ secrets.META_PAGE_TOKEN_VOA }}
          META_PAGE_ID_EARTHSTAR:      ${{ secrets.META_PAGE_ID_EARTHSTAR }}
          META_PAGE_TOKEN_EARTHSTAR:   ${{ secrets.META_PAGE_TOKEN_EARTHSTAR }}
          META_PAGE_ID_RUZINDLA:       ${{ secrets.META_PAGE_ID_RUZINDLA }}
          META_PAGE_TOKEN_RUZINDLA:    ${{ secrets.META_PAGE_TOKEN_RUZINDLA }}
          DEVTO_API_KEY:               ${{ secrets.DEVTO_API_KEY }}
          DEVTO2_API_KEY:              ${{ secrets.DEVTO2_API_KEY }}
          VOA_TUMBLR_CONSUMER_KEY:     ${{ secrets.VOA_TUMBLR_CONSUMER_KEY }}
          VOA_TUMBLR_CONSUMER_SECRET:  ${{ secrets.VOA_TUMBLR_CONSUMER_SECRET }}
          VOA_TUMBLR_TOKEN:            ${{ secrets.VOA_TUMBLR_TOKEN }}
          VOA_TUMBLR_TOKEN_SECRET:     ${{ secrets.VOA_TUMBLR_TOKEN_SECRET }}
          VOA_TUMBLR_BLOG_NAME:        ${{ secrets.VOA_TUMBLR_BLOG_NAME }}
          PUBLER_API_KEY:              ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID:         ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_PINTEREST_ACCOUNT_ID: ${{ secrets.PUBLER_PINTEREST_ACCOUNT_ID }}
          PUBLER_PINTEREST_BOARD_ID:   ${{ secrets.PUBLER_PINTEREST_BOARD_ID }}
          PUBLER_INSTAGRAM_ACCOUNT_ID: ${{ secrets.PUBLER_INSTAGRAM_ACCOUNT_ID }}
          PUBLER_THREADS_ACCOUNT_ID:   ${{ secrets.PUBLER_THREADS_ACCOUNT_ID }}
          PUBLER_FACEBOOK_ACCOUNT_ID:  ${{ secrets.PUBLER_FACEBOOK_ACCOUNT_ID }}
          BLOGGER_CLIENT_ID:           ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET:       ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN:       ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID:             ${{ secrets.BLOGGER_BLOG_ID }}
          WORDPRESS_OAUTH2_TOKEN:      ${{ secrets.WORDPRESS_OAUTH2_TOKEN }}
          WORDPRESS_BLOG:              ${{ secrets.WORDPRESS_BLOG }}
          WORDPRESS_CATEGORY_NAMES:    ${{ secrets.WORDPRESS_CATEGORY_NAMES }}
          WORDPRESS_TAG_NAMES:         ${{ secrets.WORDPRESS_TAG_NAMES }}
          DASHBOARD_PASSWORD:          ${{ secrets.DASHBOARD_PASSWORD }}
          IDEOGRAM_API_KEY:            ${{ secrets.IDEOGRAM_API_KEY }}
        run: node scripts/post-live-syndicate.js

      - name: Commit post-live syndication results
        id: post_live_commit
        if: |
          steps.queue_status.outputs.status == 'active' &&
          steps.queue_status.outputs.remaining != '0' &&
          steps.commit.outputs.nothing_committed != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A static/_data/ static/sitemap.xml || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Post-live syndication left generated changes outside standard data paths; staging all runner changes before rebase."
            git status --short
            git add -A
          fi
          if git diff --staged --quiet; then
            echo "nothing_committed=true" >> $GITHUB_OUTPUT
            echo "No post-live syndication updates to commit."
          else
            git commit -m "Update post-live syndication results [automated]"
            git fetch origin main
            git merge --no-edit -X ours origin/main
            git push
            echo "nothing_committed=false" >> $GITHUB_OUTPUT
          fi

      # ── 9. Retry any platforms that failed during this run ───────────────────
      # Runs after the first commit so the results file is available.
      # Dedup logic in syndicate.js prevents duplicate posts.
      # Dev.to is excluded from retries (canonical URL already taken = success).
      - name: Retry failed platform syndications
        id: retry
        if: steps.queue_status.outputs.status == 'active' && steps.queue_status.outputs.remaining != '0'
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
          VOA_BLUESKY_HANDLE:          ${{ secrets.VOA_BLUESKY_HANDLE }}
          VOA_BLUESKY_APP_PASSWORD:    ${{ secrets.VOA_BLUESKY_APP_PASSWORD }}
          BLUESKY_HANDLE:              ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD:        ${{ secrets.BLUESKY_APP_PASSWORD }}
          VOA_MASTODON_INSTANCE:       ${{ secrets.VOA_MASTODON_INSTANCE }}
          VOA_MASTODON_ACCESS_TOKEN:   ${{ secrets.VOA_MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE:           ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN:       ${{ secrets.MASTODON_ACCESS_TOKEN }}
          META_APP_ID:                 ${{ secrets.META_APP_ID }}
          META_APP_SECRET:             ${{ secrets.META_APP_SECRET }}
          META_USER_TOKEN:             ${{ secrets.META_USER_TOKEN }}
          META_PAGE_ID_VOA:            ${{ secrets.META_PAGE_ID_VOA }}
          META_PAGE_TOKEN_VOA:         ${{ secrets.META_PAGE_TOKEN_VOA }}
          VOA_TUMBLR_CONSUMER_KEY:     ${{ secrets.VOA_TUMBLR_CONSUMER_KEY }}
          VOA_TUMBLR_CONSUMER_SECRET:  ${{ secrets.VOA_TUMBLR_CONSUMER_SECRET }}
          VOA_TUMBLR_TOKEN:            ${{ secrets.VOA_TUMBLR_TOKEN }}
          VOA_TUMBLR_TOKEN_SECRET:     ${{ secrets.VOA_TUMBLR_TOKEN_SECRET }}
          VOA_TUMBLR_BLOG_NAME:        ${{ secrets.VOA_TUMBLR_BLOG_NAME }}
          PUBLER_API_KEY:              ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID:         ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_PINTEREST_ACCOUNT_ID: ${{ secrets.PUBLER_PINTEREST_ACCOUNT_ID }}
          PUBLER_PINTEREST_BOARD_ID:   ${{ secrets.PUBLER_PINTEREST_BOARD_ID }}
          PUBLER_INSTAGRAM_ACCOUNT_ID: ${{ secrets.PUBLER_INSTAGRAM_ACCOUNT_ID }}
          PUBLER_THREADS_ACCOUNT_ID:   ${{ secrets.PUBLER_THREADS_ACCOUNT_ID }}
          PUBLER_FACEBOOK_ACCOUNT_ID:  ${{ secrets.PUBLER_FACEBOOK_ACCOUNT_ID }}
          BLOGGER_CLIENT_ID:           ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET:       ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN:       ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID:             ${{ secrets.BLOGGER_BLOG_ID }}
          WORDPRESS_OAUTH2_TOKEN:      ${{ secrets.WORDPRESS_OAUTH2_TOKEN }}
          WORDPRESS_BLOG:              ${{ secrets.WORDPRESS_BLOG }}
        run: node scripts/retry-failed-syndication.js

      # ── 10. Commit retry results ───────────────────────────────────────────────
      - name: Commit retry results
        id: retry_commit
        if: steps.queue_status.outputs.status == 'active' && steps.queue_status.outputs.remaining != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A static/_data/ static/sitemap.xml || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Retry left generated changes outside standard data paths; staging all runner changes before rebase."
            git status --short
            git add -A
          fi
          if git diff --staged --quiet; then
            echo "nothing_committed=true" >> $GITHUB_OUTPUT
            echo "No retry updates to commit."
          else
            git commit -m "Update syndication health [automated]"
            git fetch origin main
            git merge --no-edit -X ours origin/main
            git push
            echo "nothing_committed=false" >> $GITHUB_OUTPUT
          fi
