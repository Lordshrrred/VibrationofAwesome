name: One-time - Push GA env to Vercel

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Push GA_CREDENTIALS_JSON and GA_PROPERTY_ID to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GA_CREDENTIALS_JSON: ${{ secrets.GA_CREDENTIALS_JSON }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          PROJECT_ID: prj_guDrrflKSY3FwVbmFMNyQRZyTwI9
        run: |
          push_var() {
            local key="$1"
            local value="$2"
            local payload
            payload=$(jq -n --arg key "$key" --arg value "$value" \
              '{key: $key, value: $value, type: "encrypted", target: ["production","preview","development"]}')

            status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.vercel.com/v10/projects/${PROJECT_ID}/env" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")

            if [ "$status" = "409" ]; then
              env_id=$(curl -s "https://api.vercel.com/v10/projects/${PROJECT_ID}/env" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r --arg k "$key" '.envs[] | select(.key==$k) | .id' | head -1)
              patch_payload=$(jq -n --arg value "$value" '{value: $value, target: ["production","preview","development"]}')
              status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
                -X PATCH "https://api.vercel.com/v10/projects/${PROJECT_ID}/env/${env_id}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$patch_payload")
            fi

            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "$key: ok ($status)"
            else
              echo "$key: FAILED ($status)"
              cat /tmp/resp.json
              exit 1
            fi
          }

          push_var "GA_CREDENTIALS_JSON" "$GA_CREDENTIALS_JSON"
          push_var "GA_PROPERTY_ID" "$GA_PROPERTY_ID"
