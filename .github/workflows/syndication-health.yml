name: Syndication Health

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: voa-publish-and-syndicate
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh health snapshot
        id: health
        env:
          BLUESKY_HANDLE:              ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD:        ${{ secrets.BLUESKY_APP_PASSWORD }}
          ESR_BLUESKY_HANDLE:          ${{ secrets.ESR_BLUESKY_HANDLE }}
          ESR_BLUESKY_APP_PASSWORD:    ${{ secrets.ESR_BLUESKY_APP_PASSWORD }}
          VOA_BLUESKY_HANDLE:          ${{ secrets.VOA_BLUESKY_HANDLE }}
          VOA_BLUESKY_APP_PASSWORD:    ${{ secrets.VOA_BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE:           ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN:       ${{ secrets.MASTODON_ACCESS_TOKEN }}
          ESR_MASTODON_INSTANCE:       ${{ secrets.ESR_MASTODON_INSTANCE }}
          ESR_MASTODON_ACCESS_TOKEN:   ${{ secrets.ESR_MASTODON_ACCESS_TOKEN }}
          VOA_MASTODON_INSTANCE:       ${{ secrets.VOA_MASTODON_INSTANCE }}
          VOA_MASTODON_ACCESS_TOKEN:   ${{ secrets.VOA_MASTODON_ACCESS_TOKEN }}
          META_PAGE_ID_VOA:            ${{ secrets.META_PAGE_ID_VOA }}
          META_PAGE_TOKEN_VOA:         ${{ secrets.META_PAGE_TOKEN_VOA }}
          META_PAGE_ID_EARTHSTAR:      ${{ secrets.META_PAGE_ID_EARTHSTAR }}
          META_PAGE_TOKEN_EARTHSTAR:   ${{ secrets.META_PAGE_TOKEN_EARTHSTAR }}
          DEVTO_API_KEY:               ${{ secrets.DEVTO_API_KEY }}
          DEVTO2_API_KEY:              ${{ secrets.DEVTO2_API_KEY }}
          VOA_TUMBLR_CONSUMER_KEY:     ${{ secrets.VOA_TUMBLR_CONSUMER_KEY }}
          VOA_TUMBLR_CONSUMER_SECRET:  ${{ secrets.VOA_TUMBLR_CONSUMER_SECRET }}
          VOA_TUMBLR_TOKEN:            ${{ secrets.VOA_TUMBLR_TOKEN }}
          VOA_TUMBLR_TOKEN_SECRET:     ${{ secrets.VOA_TUMBLR_TOKEN_SECRET }}
          VOA_TUMBLR_BLOG_NAME:        ${{ secrets.VOA_TUMBLR_BLOG_NAME }}
          PUBLER_API_KEY:              ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID:         ${{ secrets.PUBLER_WORKSPACE_ID }}
          PUBLER_FACEBOOK_ACCOUNT_ID:  ${{ secrets.PUBLER_FACEBOOK_ACCOUNT_ID }}
          PUBLER_INSTAGRAM_ACCOUNT_ID: ${{ secrets.PUBLER_INSTAGRAM_ACCOUNT_ID }}
          PUBLER_THREADS_ACCOUNT_ID:   ${{ secrets.PUBLER_THREADS_ACCOUNT_ID }}
          DASHBOARD_PASSWORD:          ${{ secrets.DASHBOARD_PASSWORD }}
          BLOGGER_CLIENT_ID:           ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET:       ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN:       ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID:             ${{ secrets.BLOGGER_BLOG_ID }}
          WORDPRESS_OAUTH2_TOKEN:      ${{ secrets.WORDPRESS_OAUTH2_TOKEN }}
          WORDPRESS_BLOG:              ${{ secrets.WORDPRESS_BLOG }}
        run: |
          set +e
          npm run check:syndication -- --write
          STATUS=$?
          set -e
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Alert on Blogger health failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BLOGGER_OK="$(node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("static/_data/syndication-health.json","utf8")); const c=(h.checks||[]).find(row=>row.name==="Blogger token refresh"); process.stdout.write(c && c.ok ? "1" : "0");')"
          if [ "$BLOGGER_OK" = "1" ]; then
            existing="$(gh issue list --state open --search 'Blogger syndication token needs repair in:title' --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Blogger health recovered. Latest successful check: $RUN_URL"
            fi
            exit 0
          fi

          DETAIL="$(node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("static/_data/syndication-health.json","utf8")); const c=(h.checks||[]).find(row=>row.name==="Blogger token refresh"); process.stdout.write((c && c.detail) || "Blogger token refresh failed.");')"
          existing="$(gh issue list --state open --search 'Blogger syndication token needs repair in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Blogger is still failing: $DETAIL\n\nRun: $RUN_URL\n\nRepair locally with: \`npm run blogger-token\`"
          else
            gh issue create \
              --title "Blogger syndication token needs repair" \
              --body "The scheduled syndication health check detected a Blogger OAuth refresh failure.\n\nFailure: $DETAIL\n\nRun: $RUN_URL\n\nRepair locally with: \`npm run blogger-token\`. That helper opens Google consent, saves the new refresh token to \`.env\`, and updates the GitHub Actions \`BLOGGER_REFRESH_TOKEN\` secret."
          fi

      - name: Alert on low publishing inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          QUEUE_OK="$(node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("static/_data/syndication-health.json","utf8")); const c=(h.checks||[]).find(row=>row.name==="drip queue"); process.stdout.write(c && c.ok ? "1" : "0");')"
          existing="$(gh issue list --state open --search 'Publishing queue needs new drafts in:title' --json number --jq '.[0].number // empty')"
          if [ "$QUEUE_OK" = "1" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Publishing inventory recovered. Latest successful check: $RUN_URL"
            fi
            exit 0
          fi

          DETAIL="$(node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("static/_data/syndication-health.json","utf8")); const c=(h.checks||[]).find(row=>row.name==="drip queue"); process.stdout.write((c && c.detail) || "Publishing inventory is low.");')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Publishing inventory is still low: $DETAIL\n\nRun: $RUN_URL"
          else
            gh issue create \
              --title "Publishing queue needs new drafts" \
              --body "The scheduled health check detected low publishing inventory.\n\nStatus: $DETAIL\n\nRun: $RUN_URL\n\nGenerate and review a new draft batch before the queue reaches zero."
          fi

      - name: Commit health snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/_data/syndication-health.json || true
          git diff --staged --quiet \
            || git commit -m "Update syndication health [automated]"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt) ~ rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main
          done
          echo "::error::Unable to push health snapshot after 3 attempts"
          exit 1

      - name: Fail if syndication is broken
        if: steps.health.outputs.status != '0'
        run: exit 1
