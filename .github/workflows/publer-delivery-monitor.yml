name: Publer Delivery Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send a verified test email
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: publer-delivery-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Publer and send verified email alerts
        run: node scripts/publer-delivery-monitor.js
        env:
          PUBLER_API_KEY: ${{ secrets.PUBLER_API_KEY }}
          PUBLER_WORKSPACE_ID: ${{ secrets.PUBLER_WORKSPACE_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_EMAIL: earthlingoflight@gmail.com
          MONITOR_TEST: ${{ inputs.send_test_email == true && 'true' || 'false' }}
