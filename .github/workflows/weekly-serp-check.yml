name: Weekly SERP Intelligence Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 9 * * 3'    # Every Wednesday, 9:00 AM UTC
  workflow_dispatch:

concurrency:
  group: voa-publish-and-syndicate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  serp-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SERP intelligence check
        id: serp
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          node scripts/serp_intelligence.js 2>&1 | tee serp-run.log
          STATUS=${PIPESTATUS[0]}
          set -e

          SUMMARY_LINE=$(grep '^SERP_SUMMARY' serp-run.log | tail -1)
          RANKING=$(echo "$SUMMARY_LINE" | sed -n 's/.*ranking=\([0-9]*\).*/\1/p')
          TOTAL=$(echo "$SUMMARY_LINE" | sed -n 's/.*total=\([0-9]*\).*/\1/p')
          AI_OVERVIEW=$(echo "$SUMMARY_LINE" | sed -n 's/.*ai_overview=\([0-9]*\).*/\1/p')

          echo "ranking=${RANKING:-0}"         >> "$GITHUB_OUTPUT"
          echo "total=${TOTAL:-0}"             >> "$GITHUB_OUTPUT"
          echo "ai_overview=${AI_OVERVIEW:-0}" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS"                >> "$GITHUB_OUTPUT"

          rm -f serp-run.log
          exit $STATUS

      - name: Append run summary to syndication log
        if: always() && steps.serp.outputs.total != ''
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "SERP check run: ${{ steps.serp.outputs.ranking }}/${{ steps.serp.outputs.total }} keywords ranking, ${{ steps.serp.outputs.ai_overview }} AI Overview mentions on $DATE" >> scripts/syndication_log.txt

      - name: Commit report and log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ scripts/syndication_log.txt static/_data/serp-intelligence.json || true
          git diff --staged --quiet \
            || git commit -m "Weekly SERP intelligence report [automated]"
          git push

      - name: Fail if the check itself failed
        if: steps.serp.outputs.status != '0'
        run: exit 1
