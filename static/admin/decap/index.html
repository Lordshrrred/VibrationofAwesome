<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOA Legacy Editor</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    body {
      margin: 0;
      background: #031012;
      color: #d9fff8;
      font-family: "Space Grotesk", sans-serif;
    }
    .banner {
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid rgba(0, 229, 204, 0.18);
      background: rgba(4, 14, 16, 0.92);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .banner strong {
      color: #00e5cc;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.78rem;
    }
    .banner p {
      margin: 0.35rem 0 0;
      color: #78b7af;
      font-size: 0.92rem;
    }
    .banner a {
      color: #d4c37a;
    }
  </style>
</head>
<body>
  <div class="banner">
    <strong>VOA Legacy Editor</strong>
    <p>This is the branded Decap fallback. The primary editor now lives at <a href="/admin/">/admin/</a>.</p>
  </div>
  <script>
    window.CMS_MANUAL_INIT = false;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
