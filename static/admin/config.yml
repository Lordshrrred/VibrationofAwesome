# Legacy/optional Decap CMS config for /admin/.
# The primary editor is VOA Post Studio; keep this inert config for compatibility,
# but do not prioritize Netlify auth work unless /admin/ is actively used again.
local_backend: true

backend:
  name: github
  repo: Lordshrrred/VibrationofAwesome
  branch: main
  site_domain: vibrationofawesome.netlify.app

media_folder: "static/images/uploads"
public_folder: "/images/uploads"
publish_mode: simple

editor:
  preview: true

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - {{date}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string", hint: "Used for /posts/your-slug/"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Description", name: "description", widget: "string", required: false}
      - {label: "Featured Image", name: "thumbnail", widget: "image", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Canonical URL (if cross-posted)", name: "canonical", widget: "string", required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: false, required: false}
      - {label: "Body", name: "body", widget: "markdown", buttons: ["bold", "italic", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list", "link"]}
