<style>
  :root {
    --amber: #ffb300;
    --deep: #020a0a;
    --cream: #f5ead8;
    --muted: #7a8c6e;
    --body-text: rgba(245,234,216,0.85);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--deep); color: var(--cream); font-family: 'Lora', serif; overflow-x: hidden; }

  /* ── Stars ── */
  .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--dur,3s) ease-in-out infinite; animation-delay: var(--delay,0s); opacity: 0; }
  @keyframes twinkle { 0%,100%{opacity:0;transform:scale(0.5)} 50%{opacity:var(--brightness,0.6);transform:scale(1)} }

  /* ── Nav ── */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.2rem 3rem; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(2,10,8,0.97), transparent); border-bottom: 1px solid rgba(255,179,0,0.08); }
  .nav-logo { font-family: 'Cinzel Decorative', serif; font-size: 1rem; color: var(--amber); text-decoration: none; letter-spacing: 0.15em; }
  .nav-links { display: flex; align-items: center; gap: 2rem; }
  .nav-links a { font-family: 'Rajdhani', sans-serif; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--amber); }

  /* ── Hero ── */
  .hero { position: relative; z-index: 1; padding: 9rem 4rem 4.5rem; text-align: center; border-bottom: 1px solid rgba(255,179,0,0.08); }
  .hero-eyebrow { font-family: 'Rajdhani', sans-serif; font-size: 0.68rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--amber); opacity: 0.7; margin-bottom: 1.25rem; }
  .hero-title { font-family: 'Cinzel Decorative', serif; font-size: clamp(2rem, 5vw, 3.5rem); color: var(--cream); line-height: 1.15; letter-spacing: 0.02em; margin-bottom: 1rem; }
  .hero-sub { font-family: 'Lora', serif; font-size: 1rem; line-height: 1.85; color: var(--body-text); max-width: 500px; margin: 0 auto 1rem; font-style: italic; }
  .hero-note { font-family: 'Rajdhani', sans-serif; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); opacity: 0.55; margin-bottom: 1.5rem; }
  .hero-divider { width: 60px; height: 1px; background: linear-gradient(to right, transparent, var(--amber), transparent); margin: 0 auto; }

  /* ── Grid ── */
  .gallery-section { position: relative; z-index: 1; padding: 4.5rem 4rem 7rem; max-width: 1200px; margin: 0 auto; }

  .jewelry-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }

  /* Card: 4:3 ratio using padding-bottom trick */
  .jewelry-card {
    position: relative;
    border: 1px solid rgba(255,179,0,0.1);
    background: rgba(255,179,0,0.02);
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s;
  }
  .jewelry-card:hover { border-color: rgba(255,179,0,0.35); transform: translateY(-3px); }

  /* shimmer sweep on hover */
  .jewelry-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,179,0,0.07) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.55s ease;
    z-index: 2;
    pointer-events: none;
  }
  .jewelry-card:hover::before { transform: translateX(100%); }

  /* Fixed 4:3 image container */
  .card-img-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 75%; /* 4:3 ratio */
    overflow: hidden;
    background: rgba(10,15,10,0.6);
  }
  .card-img-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
  }
  .jewelry-card:hover .card-img-wrap img { transform: scale(1.05); }

  /* Caption below card — only rendered if caption text exists */
  .card-caption {
    padding: 0.75rem 1rem 0.9rem;
    font-family: 'Lora', serif;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--body-text);
    line-height: 1.5;
    border-top: 1px solid rgba(255,179,0,0.07);
  }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 5rem 2rem; }
  .empty-state-icon { font-size: 3rem; opacity: 0.2; margin-bottom: 1.5rem; }
  .empty-state p { font-family: 'Rajdhani', sans-serif; font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); opacity: 0.55; }

  /* ── CTA ── */
  .cta-section { position: relative; z-index: 1; text-align: center; padding: 2.5rem 4rem 5.5rem; border-top: 1px solid rgba(255,179,0,0.08); }
  .btn-amber { display: inline-block; font-family: 'Rajdhani', sans-serif; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--deep); background: var(--amber); padding: 0.85rem 2.2rem; text-decoration: none; transition: box-shadow 0.2s; }
  .btn-amber:hover { box-shadow: 0 0 25px rgba(255,179,0,0.35); }
  .btn-ghost { display: inline-block; margin-left: 1rem; font-family: 'Rajdhani', sans-serif; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--amber); border: 1px solid rgba(255,179,0,0.3); padding: 0.8rem 1.8rem; text-decoration: none; transition: border-color 0.2s, background 0.2s; }
  .btn-ghost:hover { border-color: var(--amber); background: rgba(255,179,0,0.04); }

  /* ── Footer ── */
  footer { padding: 3rem 4rem; border-top: 1px solid rgba(255,179,0,0.08); text-align: center; position: relative; z-index: 1; }
  footer p { font-family: 'Rajdhani', sans-serif; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); opacity: 0.6; }
  footer a { color: var(--amber); text-decoration: none; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .jewelry-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { gap: 1.2rem; }
    .hero { padding: 7rem 1.5rem 3rem; }
    .gallery-section { padding: 3rem 1.5rem 5rem; }
    .cta-section { padding: 2rem 1.5rem 3.5rem; }
    footer { padding: 2rem 1.5rem; }
    .btn-ghost { margin-left: 0; margin-top: 0.75rem; display: inline-block; }
  }
  @media (max-width: 500px) {
    .jewelry-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<nav>
  <a href="/" class="nav-logo">VOA</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/blog/">Blog</a>
    <a href="/art-store/">Art Store</a>
    <a href="/portfolio/">Portfolio</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-eyebrow">Matt EarthStar &middot; Wearable Art</div>
  <h1 class="hero-title">Handcrafted</h1>
  <p class="hero-sub">Wire wrap, crystal, and wearable art</p>
  <div class="hero-note">More pieces coming soon</div>
  <div class="hero-divider"></div>
</div>

<div class="gallery-section">
  <div class="jewelry-grid" id="jewelryGrid">
    <!-- Populated by JS from photo-metadata.json -->
  </div>
</div>

<div class="cta-section">
  <a href="/art-store/" class="btn-amber">Visit the Art Store</a>
  <a href="/portfolio/" class="btn-ghost">All Portfolio</a>
</div>

<footer>
  <p>&copy; 2026 <a href="/">Vibration of Awesome</a> &mdash;
     <a href="/portfolio/">Portfolio</a> &mdash;
     <a href="/portfolio/jewelry.html">Handcrafted</a> &mdash;
     <a href="/art-store/">Art Store</a> &mdash;
     <a href="/blog/">Blog</a></p>
</footer>

<script>
  // ── Stars ──
  const s = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const el = document.createElement('div'); el.className = 'star';
    const sz = Math.random() * 2 + 0.5;
    el.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;--dur:'+(Math.random()*4+2)+'s;--delay:'+(Math.random()*5)+'s;--brightness:'+(Math.random()*0.5+0.2)+';';
    s.appendChild(el);
  }

  // ══════════════════════════════════════════════════════════════════════
  // JEWELRY MANIFEST — hardcoded list of actual files in
  // static/personal-photos/jewelry/
  //
  // GitHub Pages cannot enumerate directories, so this list IS the source
  // of truth for which photos exist.
  //
  // TO ADD A PHOTO:
  //   1. Drop the .jpg file into static/personal-photos/jewelry/
  //   2. Add its filename to the array below
  //   3. Optionally add a caption in photo-metadata.json under "jewelry"
  //   4. Commit and push — the photo will appear automatically
  // ══════════════════════════════════════════════════════════════════════
  const JEWELRY_FILES = [
    // 'your-photo.jpg',
    // 'another-piece.jpg',
  ];

  // ── Load captions from photo-metadata.json (best-effort, non-blocking) ──
  // metadata.jewelry shape: { "filename.jpg": { caption, tags }, ... }
  function buildGrid(captions) {
    const grid = document.getElementById('jewelryGrid');

    // Merge: start with the hardcoded manifest, then fold in any extra
    // filenames found in the metadata that aren't already listed.
    const seen = new Set(JEWELRY_FILES);
    const metaFiles = Object.keys(captions);
    metaFiles.forEach(f => { if (!seen.has(f)) { seen.add(f); JEWELRY_FILES.push(f); } });

    if (JEWELRY_FILES.length === 0) {
      grid.innerHTML =
        '<div class="empty-state" style="grid-column:1/-1">' +
          '<div class="empty-state-icon">💎</div>' +
          '<p>Photos coming soon</p>' +
        '</div>';
      return;
    }

    JEWELRY_FILES.forEach(filename => {
      const entry   = captions[filename] || {};
      const caption = (entry.caption || '').trim();

      const card = document.createElement('div');
      card.className = 'jewelry-card';

      const wrap = document.createElement('div');
      wrap.className = 'card-img-wrap';

      const img = document.createElement('img');
      img.src     = '/personal-photos/jewelry/' + filename;
      img.alt     = caption || filename;
      img.loading = 'lazy';

      // If the file doesn't actually exist, hide the whole card cleanly
      img.onerror = () => { card.style.display = 'none'; };

      wrap.appendChild(img);
      card.appendChild(wrap);

      if (caption) {
        const cap = document.createElement('div');
        cap.className   = 'card-caption';
        cap.textContent = caption;
        card.appendChild(cap);
      }

      grid.appendChild(card);
    });
  }

  // Try to load captions; fall back to empty captions if fetch fails
  fetch('/personal-photos/photo-metadata.json')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => buildGrid(data.jewelry || {}))
    .catch(() => buildGrid({}));
</script>
</body>
</html>
