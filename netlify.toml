[build]
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# esbuild bundler handles both CJS (exports.handler) and ESM (export const handler)
# functions transparently, even though root package.json has "type":"module".
# Without this, CJS functions crash with "exports is not defined in ES module scope".
[functions]
  node_bundler = "esbuild"
  timeout      = 30
